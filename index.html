<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTH Agency</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;

        // --- ICON COMPONENTS ---
        // Replacing lucide-react with inline SVGs for the standalone HTML file
        const Icon = ({ path, size = 24, className = '', ...props }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={props.strokeWidth || 2} strokeLinecap="round" strokeLinejoin="round" className={className} {...props} dangerouslySetInnerHTML={{ __html: path }} />
        );

        const Palette = (props) => <Icon path={'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>'} {...props} />;
        const MonitorSmartphone = (props) => <Icon path={'<path d="M18 8V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h8"/><path d="M10 19v-3.96 3.15"/><path d="M7 19h5"/><rect width="6" height="10" x="16" y="12" rx="2"/>'} {...props} />;
        const Megaphone = (props) => <Icon path={'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'} {...props} />;
        const Video = (props) => <Icon path={'<path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>'} {...props} />;
        const Sparkles = (props) => <Icon path={'<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>'} {...props} />;
        const ArrowRight = (props) => <Icon path={'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'} {...props} />;
        const Send = (props) => <Icon path={'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'} {...props} />;
        const CheckCircle2 = (props) => <Icon path={'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'} {...props} />;
        const MessageSquare = (props) => <Icon path={'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'} {...props} />;
        const X = (props) => <Icon path={'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'} {...props} />;
        const Globe = (props) => <Icon path={'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'} {...props} />;

        // --- APP LOGIC ---
        const translations = {
          en: {
            nav: { services: 'Services', contact: 'Contact', cta: 'Start Project' },
            hero: {
              badge: 'The digital agency for modern brands',
              headlineLine1: 'SIMPLE. CREATIVE.',
              headlineHighlight: 'GENIUS.',
              subheadline: 'We build digital experiences that not only look fantastic, but also deliver results. Websites, Branding, and Social Media.',
              btnPrimary: 'Start Project',
              btnSecondary: 'Let\'s talk'
            },
            services: {
              title: 'WHAT WE',
              titleHighlight: 'DO.',
              subtitle: 'Everything you need for a strong digital presence. All from a single source.',
              cards: [
                { title: 'Web Design & Dev', desc: 'Fast, beautiful websites. Optimized for all devices and search engines.' },
                { title: 'Branding & Logo', desc: 'Unique identities. We give your brand a face that sticks in the mind.' },
                { title: 'Digital Marketing', desc: 'Visibility that scales. We bring your message exactly to your target audience.' },
                { title: 'Social & Reels', desc: 'TikTok, Instagram, Facebook. We create content that gets shared and goes viral.' }
              ]
            },
            contact: {
              title: 'LET\'S START SOMETHING',
              titleHighlight: 'BIG.',
              subtitle: 'Send us a message. We will get back to you lightning fast.',
              perks: ['Free consultation', 'Custom quote', 'Fast execution'],
              form: {
                nameLabel: 'Name', namePlaceholder: 'Your Name',
                emailLabel: 'Email', emailPlaceholder: 'hello@company.com',
                msgLabel: 'How can we help?', msgPlaceholder: 'Tell us about your project...',
                submit: 'Send Message'
              }
            },
            footer: {
              imprint: 'Imprint', privacy: 'Privacy', terms: 'Terms',
              copyright: '© 2026 XTH Agency. Made with ❤️ in Germany.'
            },
            chat: {
              title: 'Chat with us',
              placeholder: 'Type a message...',
              initialMsg: 'Hi there! 👋 How can we help you today?',
              botReply: 'Thanks for your message! This is a demo chat. In a real scenario, an agent would reply here. You can also use our contact form!',
              send: 'Send'
            }
          },
          ar: {
            nav: { services: 'الخدمات', contact: 'اتصال', cta: 'ابدأ المشروع' },
            hero: {
              badge: 'الوكالة الرقمية للعلامات التجارية الحديثة',
              headlineLine1: 'بسيط. إبداعي.',
              headlineHighlight: 'عبقري.',
              subheadline: 'نحن نبني تجارب رقمية لا تبدو رائعة فحسب، بل تحقق نتائج أيضاً. مواقع الويب، العلامات التجارية، ووسائل التواصل الاجتماعي.',
              btnPrimary: 'ابدأ المشروع',
              btnSecondary: 'دعنا نتحدث'
            },
            services: {
              title: 'ماذا',
              titleHighlight: 'نقدم.',
              subtitle: 'كل ما تحتاجه لحضور رقمي قوي. كل شيء من مصدر واحد.',
              cards: [
                { title: 'تصميم وتطوير الويب', desc: 'مواقع سريعة وجميلة. محسنة لجميع الأجهزة ومحركات البحث.' },
                { title: 'العلامة التجارية والشعار', desc: 'هويات فريدة. نمنح علامتك التجارية وجهاً يبقى في الذاكرة.' },
                { title: 'التسويق الرقمي', desc: 'رؤية تتوسع. نوصل رسالتك بدقة إلى جمهورك المستهدف.' },
                { title: 'السوشيال ميديا والريلز', desc: 'تيك توك، انستغرام، فيسبوك. نصنع محتوى يتم مشاركته وينتشر بسرعة.' }
              ]
            },
            contact: {
              title: 'دعنا نبدأ شيئاً',
              titleHighlight: 'كبيراً.',
              subtitle: 'أرسل لنا رسالة. سنرد عليك بسرعة البرق.',
              perks: ['استشارة مجانية', 'عرض أسعار مخصص', 'تنفيذ سريع'],
              form: {
                nameLabel: 'الاسم', namePlaceholder: 'اسمك',
                emailLabel: 'البريد الإلكتروني', emailPlaceholder: 'hello@company.com',
                msgLabel: 'كيف يمكننا المساعدة؟', msgPlaceholder: 'أخبرنا عن مشروعك...',
                submit: 'إرسال الرسالة'
              }
            },
            footer: {
              imprint: 'بصمة', privacy: 'الخصوصية', terms: 'الشروط',
              copyright: '© 2026 XTH Agency. صنع بـ ❤️ في ألمانيا.'
            },
            chat: {
              title: 'تحدث معنا',
              placeholder: 'اكتب رسالة...',
              initialMsg: 'مرحباً! 👋 كيف يمكننا مساعدتك اليوم؟',
              botReply: 'شكراً لرسالتك! هذه محادثة تجريبية. في الواقع، سيرد عليك أحد وكلائنا هنا. يمكنك أيضاً استخدام نموذج الاتصال!',
              send: 'إرسال'
            }
          }
        };

        const LanguageContext = createContext();

        const useScrollReveal = () => {
          const [isVisible, setIsVisible] = useState(false);
          const domRef = useRef(null);

          useEffect(() => {
            const observer = new IntersectionObserver(entries => {
              entries.forEach(entry => {
                if (entry.isIntersecting) {
                  setIsVisible(true);
                }
              });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            const currentRef = domRef.current;
            if (currentRef) observer.observe(currentRef);
            return () => {
              if (currentRef) observer.unobserve(currentRef);
            };
          }, []);

          return [domRef, isVisible];
        };

        const GlobalStyles = ({ lang }) => (
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

            :root {
              --bg-color: #E7ECEF;
              --brand-blue: #274C77;
              --brand-blue-light: rgba(39, 76, 119, 0.1);
              --accent-yellow: #FFD60A;
            }

            body {
              background-color: var(--bg-color); 
              color: var(--brand-blue); 
              font-family: ${lang === 'ar' ? "'Cairo'" : "'Plus Jakarta Sans'"}, sans-serif;
              overflow-x: hidden;
              -webkit-font-smoothing: antialiased;
              -moz-osx-font-smoothing: grayscale;
            }

            [dir="rtl"] body {
              font-size: 1.05rem; 
            }
            
            [dir="rtl"] p, 
            [dir="rtl"] span, 
            [dir="rtl"] button {
              font-weight: 700;
              line-height: 1.8;
            }

            .font-heading {
              font-family: ${lang === 'ar' ? "'Cairo'" : "'Anton'"}, sans-serif;
              letter-spacing: ${lang === 'ar' ? 'normal' : '1px'};
              font-weight: ${lang === 'ar' ? '900' : '400'};
            }

            [dir="rtl"] .font-heading {
              line-height: 1.4;
            }

            .logo-text-fallback {
              font-family: 'Anton', sans-serif;
              color: #E7ECEF;
              -webkit-text-stroke: 1.5px #274C77;
              letter-spacing: 2px;
              font-size: 2.25rem;
              line-height: 1;
            }

            .reveal {
              opacity: 0;
              transform: translateY(30px) scale(0.95);
              transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); 
            }
            .reveal.active {
              opacity: 1;
              transform: translateY(0) scale(1);
            }

            .delay-100 { transition-delay: 100ms; }
            .delay-200 { transition-delay: 200ms; }
            .delay-300 { transition-delay: 300ms; }

            .apple-glass {
              background: rgba(255, 255, 255, 0.75);
              backdrop-filter: blur(24px);
              -webkit-backdrop-filter: blur(24px);
              border: 1px solid rgba(255, 255, 255, 0.8);
            }

            .btn-press {
              transition: all 0.15s ease;
              box-shadow: 0 6px 0 rgba(39, 76, 119, 0.15), 0 12px 16px rgba(39, 76, 119, 0.1);
            }
            .btn-press:active {
              transform: translateY(4px);
              box-shadow: 0 2px 0 rgba(39, 76, 119, 0.15), 0 4px 8px rgba(39, 76, 119, 0.1);
            }

            @keyframes blob {
              0% { transform: translate(0px, 0px) scale(1); }
              33% { transform: translate(30px, -50px) scale(1.1); }
              66% { transform: translate(-20px, 20px) scale(0.9); }
              100% { transform: translate(0px, 0px) scale(1); }
            }
            @keyframes chatPop {
              0% { opacity: 0; transform: scale(0.9) translateY(20px); }
              100% { opacity: 1; transform: scale(1) translateY(0); }
            }
            .animate-blob {
              animation: blob 10s infinite alternate ease-in-out;
            }
            .animation-delay-2000 {
              animation-delay: 2s;
            }
            .animation-delay-4000 {
              animation-delay: 4s;
            }
          `}</style>
        );

        const PlayfulBackground = () => (
          <div className="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
            <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-[#274C77] mix-blend-multiply filter blur-[100px] opacity-[0.07] animate-blob"></div>
            <div className="absolute top-[20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-[#274C77] mix-blend-multiply filter blur-[100px] opacity-[0.05] animate-blob animation-delay-2000"></div>
            <div className="absolute bottom-[-20%] left-[20%] w-[700px] h-[700px] rounded-full bg-[var(--accent-yellow)] mix-blend-multiply filter blur-[120px] opacity-[0.12] animate-blob animation-delay-4000"></div>
            <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMzksIDc2LCAxMTksIDAuMSkiLz48L3N2Zz4=')] opacity-60"></div>
          </div>
        );

        const Navbar = () => {
          const { lang, setLang, t, scrollToSection } = useContext(LanguageContext);
          const [imgError, setImgError] = useState(false);

          const navLinks = [
            { label: t.nav.services, target: 'services-section' },
            { label: t.nav.contact, target: 'contact-section' }
          ];

          return (
            <nav className="fixed w-full top-6 z-50 px-6 flex justify-center">
              <div className="apple-glass px-6 py-3 rounded-full flex justify-between items-center w-full max-w-5xl shadow-sm gap-4">
                
                <div className="flex items-center gap-2 cursor-pointer shrink-0" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                  {!imgError ? (
                    <img 
                      src="textlogoNOBG.png" 
                      alt="XTH Logo" 
                      className="h-10 object-contain drop-shadow-sm" 
                      onError={() => setImgError(true)}
                    />
                  ) : (
                    <span className="logo-text-fallback">XTH</span>
                  )}
                </div>
                
                <div className="hidden md:flex gap-8 font-semibold text-sm text-[#274C77]/70">
                  {navLinks.map((item, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => scrollToSection(item.target)} 
                      className="hover:text-[#274C77] transition-colors font-bold uppercase tracking-wider text-xs"
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
                
                <div className="flex items-center gap-4 shrink-0">
                  <div className="flex items-center gap-1 bg-[#274C77]/5 p-1 rounded-full border border-[#274C77]/10">
                    <button 
                      onClick={() => setLang('en')} 
                      className={`px-3 py-1 text-xs font-bold rounded-full transition-all ${lang === 'en' ? 'bg-white shadow-sm text-[#274C77]' : 'text-[#274C77]/50 hover:text-[#274C77]'}`}
                    >
                      EN
                    </button>
                    <button 
                      onClick={() => setLang('ar')} 
                      className={`px-3 py-1 text-xs font-bold rounded-full transition-all ${lang === 'ar' ? 'bg-white shadow-sm text-[#274C77]' : 'text-[#274C77]/50 hover:text-[#274C77]'}`}
                    >
                      AR
                    </button>
                  </div>

                  <button onClick={() => scrollToSection('contact-section')} className="hidden sm:block bg-[#274C77] hover:bg-[#1f3d60] text-white px-5 py-2.5 rounded-full font-bold text-sm transition-all shadow-md hover:shadow-lg active:scale-95">
                    {t.nav.cta}
                  </button>
                </div>
              </div>
            </nav>
          );
        };

        const Hero = () => {
          const [ref, isVisible] = useScrollReveal();
          const { t, lang, scrollToSection, setIsChatOpen } = useContext(LanguageContext);

          return (
            <section className="relative min-h-screen flex items-center justify-center pt-32 pb-20 px-6">
              <div ref={ref} className={`relative z-10 max-w-4xl mx-auto text-center reveal ${isVisible ? 'active' : ''}`}>
                
                <div className="inline-flex items-center gap-2 mb-8 px-5 py-2.5 rounded-full bg-white shadow-sm border border-white/50 font-bold text-sm text-[#274C77]">
                  <Sparkles className="w-4 h-4 text-[var(--accent-yellow)]" />
                  <span>{t.hero.badge}</span>
                </div>

                <h1 className="font-heading text-6xl md:text-8xl text-[#274C77] leading-[1.1] mb-8">
                  {t.hero.headlineLine1} <br/>
                  <span className="relative inline-block mt-2">
                    <span className="relative z-10 text-[#274C77] px-4 py-1">{t.hero.headlineHighlight}</span>
                    <span className="absolute inset-0 bg-[var(--accent-yellow)] rounded-xl -rotate-2 scale-105 z-0 shadow-sm"></span>
                  </span>
                </h1>

                <p className="text-xl text-[#274C77]/80 mb-12 max-w-2xl mx-auto font-semibold leading-relaxed">
                  {t.hero.subheadline}
                </p>

                <div className="flex flex-col sm:flex-row gap-6 justify-center items-center">
                  <button onClick={() => scrollToSection('contact-section')} className="btn-press bg-[#274C77] text-white text-lg font-bold px-8 py-4 rounded-2xl flex items-center gap-3 w-full sm:w-auto justify-center">
                    {t.hero.btnPrimary}
                    <ArrowRight className={`w-5 h-5 ${lang === 'ar' ? 'rotate-180' : ''}`} />
                  </button>
                  
                  <button onClick={() => setIsChatOpen(true)} className="text-[#274C77] hover:bg-white/50 font-bold px-8 py-4 rounded-2xl flex items-center gap-2 transition-colors border-2 border-transparent hover:border-white">
                    <MessageSquare className="w-5 h-5" />
                    {t.hero.btnSecondary}
                  </button>
                </div>
              </div>
            </section>
          );
        };

        const Services = () => {
          const [ref, isVisible] = useScrollReveal();
          const { t } = useContext(LanguageContext);
          
          const icons = [
            <MonitorSmartphone key="1" />, 
            <Palette key="2" />, 
            <Megaphone key="3" />, 
            <Video key="4" />
          ];
          const delays = ['', 'delay-100', 'delay-200', 'delay-300'];

          return (
            <section id="services-section" className="py-24 px-6 relative z-10">
              <div className="max-w-6xl mx-auto">
                <div ref={ref} className={`text-center mb-16 reveal ${isVisible ? 'active' : ''}`}>
                  <h2 className="font-heading text-5xl md:text-6xl text-[#274C77] mb-6">
                    {t.services.title} <span className="relative inline-block px-3 py-1 mt-2 md:mt-0"><span className="absolute inset-0 bg-[var(--accent-yellow)] rounded-xl rotate-2 z-0"></span><span className="relative z-10 text-[#274C77]">{t.services.titleHighlight}</span></span>
                  </h2>
                  <p className="text-lg text-[#274C77]/80 max-w-2xl mx-auto font-semibold">
                    {t.services.subtitle}
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  {t.services.cards.map((svc, idx) => (
                    <div 
                      key={idx} 
                      className={`bg-white/80 backdrop-blur-md p-8 md:p-10 rounded-[2.5rem] shadow-[0_8px_30px_rgb(39,76,119,0.06)] hover:shadow-[0_20px_40px_rgb(39,76,119,0.12)] transition-all duration-300 hover:-translate-y-2 border border-white reveal ${isVisible ? 'active' : ''} ${delays[idx]}`}
                    >
                      <div className={`w-16 h-16 rounded-2xl bg-[#E7ECEF] text-[#274C77] flex items-center justify-center mb-6 shadow-sm border border-[#274C77]/10`}>
                        {React.cloneElement(icons[idx], { size: 32, strokeWidth: 2.5 })}
                      </div>
                      <h3 className="text-2xl font-bold text-[#274C77] mb-4">{svc.title}</h3>
                      <p className="text-[#274C77]/70 leading-relaxed font-semibold text-lg">
                        {svc.desc}
                      </p>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          );
        };

        const Contact = () => {
          const [ref, isVisible] = useScrollReveal();
          const { t, lang } = useContext(LanguageContext);
          
          return (
            <section id="contact-section" className="py-32 px-6 relative z-10">
              <div ref={ref} className={`max-w-5xl mx-auto reveal ${isVisible ? 'active' : ''}`}>
                <div className="bg-white rounded-[3rem] p-8 md:p-16 shadow-[0_20px_60px_rgb(39,76,119,0.08)] relative overflow-hidden border border-white">
                  
                  <div className="relative z-10 grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                    <div>
                      <h2 className="font-heading text-5xl md:text-6xl text-[#274C77] mb-6 leading-[1.1]">
                        {t.contact.title} <br/><span className="relative inline-block px-3 py-1 mt-3"><span className="absolute inset-0 bg-[var(--accent-yellow)] rounded-xl -rotate-2 z-0"></span><span className="relative z-10 text-[#274C77]">{t.contact.titleHighlight}</span></span>
                      </h2>
                      <p className="text-[#274C77]/80 mb-10 text-xl font-semibold">
                        {t.contact.subtitle}
                      </p>
                      
                      <div className="space-y-5">
                        {t.contact.perks.map((perk, i) => (
                          <div key={i} className="flex items-center gap-4 text-[#274C77] font-bold text-lg">
                            <div className="bg-[var(--accent-yellow)]/90 p-1.5 rounded-full">
                              <CheckCircle2 className="text-[#274C77] w-6 h-6 shrink-0" />
                            </div>
                            {perk}
                          </div>
                        ))}
                      </div>
                    </div>

                    <form className="bg-[#E7ECEF]/50 rounded-[2.5rem] p-8 border border-white shadow-inner" onSubmit={(e) => e.preventDefault()}>
                      <div className="space-y-5">
                        <div>
                          <label className="block text-sm font-bold text-[#274C77] mb-2">{t.contact.form.nameLabel}</label>
                          <input 
                            type="text" 
                            className="w-full bg-white border-2 border-transparent rounded-2xl p-4 text-[#274C77] focus:outline-none focus:border-[#274C77]/30 transition-all font-semibold shadow-sm" 
                            placeholder={t.contact.form.namePlaceholder} 
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-[#274C77] mb-2">{t.contact.form.emailLabel}</label>
                          <input 
                            type="email" 
                            className="w-full bg-white border-2 border-transparent rounded-2xl p-4 text-[#274C77] focus:outline-none focus:border-[#274C77]/30 transition-all font-semibold shadow-sm" 
                            placeholder={t.contact.form.emailPlaceholder} 
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-[#274C77] mb-2">{t.contact.form.msgLabel}</label>
                          <textarea 
                            rows="4" 
                            className="w-full bg-white border-2 border-transparent rounded-2xl p-4 text-[#274C77] focus:outline-none focus:border-[#274C77]/30 transition-all font-semibold resize-none shadow-sm" 
                            placeholder={t.contact.form.msgPlaceholder}
                          ></textarea>
                        </div>

                        <button className="w-full btn-press bg-[#274C77] text-white font-bold text-xl rounded-2xl py-4 flex items-center justify-center gap-3 mt-4">
                          {t.contact.form.submit}
                          <Send className={`w-5 h-5 ${lang === 'ar' ? 'rotate-180' : ''}`} />
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </section>
          );
        };

        const ChatWidget = () => {
          const { t, lang, isChatOpen, setIsChatOpen } = useContext(LanguageContext);
          const [messages, setMessages] = useState([]);
          const [input, setInput] = useState('');
          const messagesEndRef = useRef(null);

          useEffect(() => {
            if (isChatOpen && messages.length === 0) {
              setMessages([{ text: t.chat.initialMsg, isBot: true }]);
            }
          }, [isChatOpen, messages.length, t.chat.initialMsg]);

          useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [messages]);

          const handleSend = (e) => {
            e.preventDefault();
            if (!input.trim()) return;
            
            const userMsg = input;
            setMessages(prev => [...prev, { text: userMsg, isBot: false }]);
            setInput('');

            setTimeout(() => {
              setMessages(prev => [...prev, { text: t.chat.botReply, isBot: true }]);
            }, 1200);
          };

          if (!isChatOpen) return null;

          return (
            <div className="fixed bottom-6 right-6 z-[100] w-[350px] max-w-[calc(100vw-3rem)] bg-white/90 backdrop-blur-2xl border border-white shadow-[0_20px_50px_rgb(39,76,119,0.15)] rounded-3xl overflow-hidden flex flex-col origin-bottom-right animate-[chatPop_0.3s_ease-out_forwards]">
              <div className="bg-[#274C77] p-4 flex justify-between items-center text-white shadow-md z-10">
                <div className="flex items-center gap-2 font-bold">
                  <MessageSquare className="w-5 h-5" />
                  {t.chat.title}
                </div>
                <button 
                  onClick={() => setIsChatOpen(false)} 
                  className="hover:bg-white/20 p-1.5 rounded-full transition-colors active:scale-95"
                >
                  <X className="w-5 h-5"/>
                </button>
              </div>
              
              <div className="h-80 p-4 overflow-y-auto flex flex-col gap-3 bg-[#E7ECEF]/30">
                {messages.map((msg, idx) => (
                  <div key={idx} className={`max-w-[85%] p-3.5 rounded-2xl text-sm font-semibold shadow-sm ${msg.isBot ? 'bg-white border border-white text-[#274C77] self-start rounded-tl-sm' : 'bg-[#274C77] text-white self-end rounded-tr-sm'}`}>
                    {msg.text}
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>
              
              <form onSubmit={handleSend} className="p-3 bg-white border-t border-[#E7ECEF] flex gap-2">
                <input 
                  type="text" 
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder={t.chat.placeholder}
                  className="flex-1 bg-[#E7ECEF]/50 border-2 border-transparent rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-[#274C77]/20 transition-colors font-semibold text-[#274C77]"
                />
                <button 
                  type="submit"
                  className="bg-[#274C77] text-white p-3 rounded-xl hover:bg-[#1a3352] transition-colors btn-press flex items-center justify-center shrink-0"
                >
                  <Send className={`w-5 h-5 ${lang === 'ar' ? 'rotate-180' : ''}`} />
                </button>
              </form>
            </div>
          );
        };

        const Footer = () => {
          const { t, lang } = useContext(LanguageContext);
          const [imgError, setImgError] = useState(false);
          
          return (
            <footer className="py-12 px-6 text-center">
              <div className="flex items-center justify-center gap-2 mb-8">
                {!imgError ? (
                  <img 
                    src="textlogoNOBG.png" 
                    alt="XTH Logo" 
                    className="h-12 object-contain opacity-80" 
                    onError={() => setImgError(true)}
                  />
                ) : (
                  <span className="logo-text-fallback">XTH</span>
                )}
              </div>
              <div className="flex justify-center gap-8 mb-8 font-bold text-[#274C77]/50 text-sm uppercase tracking-wider">
                <a href="#" className="hover:text-[#274C77] transition-colors">{t.footer.imprint}</a>
                <a href="#" className="hover:text-[#274C77] transition-colors">{t.footer.privacy}</a>
                <a href="#" className="hover:text-[#274C77] transition-colors">{t.footer.terms}</a>
              </div>
              <p className="text-[#274C77]/40 font-semibold text-sm">
                {t.footer.copyright}
              </p>
            </footer>
          );
        };

        const App = () => {
          const [lang, setLang] = useState('en');
          const [isChatOpen, setIsChatOpen] = useState(false);
          const t = translations[lang];

          const scrollToSection = (sectionId) => {
            const section = document.getElementById(sectionId);
            if (section) {
              section.scrollIntoView({ behavior: 'smooth' });
            }
          };

          return (
            <LanguageContext.Provider value={{ lang, setLang, t, isChatOpen, setIsChatOpen, scrollToSection }}>
              <div 
                dir={lang === 'ar' ? 'rtl' : 'ltr'} 
                className="relative min-h-screen selection:bg-[var(--accent-yellow)] selection:text-[#274C77]"
              >
                <GlobalStyles lang={lang} />
                <PlayfulBackground />
                
                <Navbar />
                <main>
                  <Hero />
                  <Services />
                  <Contact />
                </main>
                <Footer />
                <ChatWidget />
              </div>
            </LanguageContext.Provider>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
